<!DOCTYPE html>
<html>
    <head> 
        <title>A Simple Scene</title>
         <script src= "https://aframe.io/releases/1.7.0/aframe.min.js">
          </script>
          </head>
          <body>
             <a-scene>
                <a-box
                color="grey"
                position="3 .2 -11"
                rotation="0 0 0"
                width="4"
                height="1"
                depth="2">
            </a-box>
            <a-sphere
            color="yellow"
            position="3.5 2.3 -11"
            radius=".2">
        </a-sphere>
        <a-cylinder
        color="grey"
        position="3.5 3 -11"
        rotation="0 0 0"
        radius=".1"
        height="1">
    </a-cylinder>
    <a-cone
    color="blue"
    position="4.2 1.09 -9"
    rotation="90 0 0"
    radius-bottom="0.1"
    height="0.6">
</a-cone>
<a-plane
color="black"
position="4.4 1.8 -13.5"
rotation="-0 -90 0"
width="1"
height="1">
</a-plane>
<a-box
color="grey"
position="4.4 0.5 -9"
rotation="0 0 0"
width="1"
height="1"
depth="1">
</a-box>
<a-text
value="Pediatric
Dentist"
color="purple"
position="1 2 -5.5"
width="15">
<a-box
color="grey"
position="3.5 -1.4 -8"
rotation="0 0 0"
width="1"
height="1.3"
depth="1">
</a-box>
</a-text>
                 <a-plane 
                 color="forestgreen" 
                 position="0 0 0" 
                 rotation="-90 0 0"
                  width="500"
                  height="500" > 
                </a-plane>
                 <a-sky
                  color="lightskyblue" >
                 </a-sky>
                 <a-mixin
                 id="wallcolor"
                 color="lightsteelblue">
                </a-mixin>
                <a-box
                mixin="wallcolor"
                position="0 1.5 -16"
                rotation="0 0 0"
                width="10"
                height="3"
                depth="0.1">
            </a-box>
            <a-box
            mixin="wallcolor"
            position="-5 1.5 -11"
            rotation="0 90 0"
            width="10"
            height="3"
            depth="0.1">
        </a-box>
        <a-box
        mixin="wallcolor"
        position="5 1.5 -11"
        rotation="0 90 0"
        width="10"
        height="3"
        depth="0.1">
    </a-box>
    <a-box
    mixin="wallcolor"
    position="-2.875 1.5 -6"r
    otation="0 0 0"
    width="4.25"
    height="3"
    depth="0.1">
</a-box>
<a-box
mixin="wallcolor"
position="2.875 1.5 -6"
rotation="0 0 0"
width="4.25"
height="3"
depth="0.1">
</a-box>
<a-box
mixin="wallcolor"
position="0 2.75 -6"
rotation="0 0 0"
width="1.5"
height="0.5"
depth="0.1">
</a-box>
<a-box
color="white"
position="0 0 -11"
width="10"
depth="10"
height="0.1">
</a-box>
<a-box
color="brown"
position="0 3 -11"
width="12"
depth="12"
height="0.25">
</a-box>
                 </a-scene>
                </body>
                </html>
